name: Chert
description: >-
  Chert is iMessage infrastructure for reaching people at scale. Its Messaging API lets
  teams programmatically send, receive, route, and observe real iMessage conversations —
  blue-bubble threads from verified numbers with typing indicators, tapback reactions,
  reply context, multi-recipient group threads, SMS fallback, file attachments, rich-link
  previews, one-time location pins, and delivery receipts. Chert also ships native
  integrations for Salesforce, HubSpot, and Slack, plus webhook subscriptions and an event
  stream (message.received, reaction.added/removed) for real-time inbound replies. Auth is
  bearer token or HMAC-SHA256 request signing; writes support an idempotency_key. Chert is a
  Y Combinator (Spring 2026) company based in the San Francisco Bay Area.
